<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background pattern -->
    <pattern id="bgPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#1e293b" opacity="0.5"/>
    </pattern>

    <!-- Elegant arrow markers -->
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,2 L10,6 L0,10 L2,6 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrow-rose" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,2 L10,6 L0,10 L2,6 Z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,2 L10,6 L0,10 L2,6 Z" fill="#fbbf24"/>
    </marker>

    <!-- Soft glow filters -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft shadows for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="encoderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0f766e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#134e4a" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="decoderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="srcInputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <linearGradient id="tgtInputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="780" fill="#0f172a"/>
  <rect width="900" height="780" fill="url(#bgPattern)"/>

  <!-- Subtle top accent line -->
  <rect x="0" y="0" width="900" height="3" fill="url(#encoderGrad)"/>

  <!-- Title with elegant styling -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" letter-spacing="0.5">Transformer.forward()</text>
  <text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Data Flow Architecture</text>
  <line x1="360" y1="75" x2="540" y2="75" stroke="#334155" stroke-width="1"/>

  <!-- ==================== SOURCE PATH (LEFT) ==================== -->

  <!-- Source Input -->
  <rect x="55" y="95" width="170" height="48" rx="12" fill="#131c31" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="55" y="95" width="170" height="48" rx="12" fill="url(#srcInputGrad)" opacity="0.15"/>
  <text x="140" y="120" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">src (token IDs)</text>
  <text x="140" y="140" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">(batch, src_seq_len)</text>

  <!-- Arrow -->
  <line x1="140" y1="143" x2="140" y2="168" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow-teal)" opacity="0.9"/>

  <!-- Source Token Embedding -->
  <rect x="65" y="175" width="150" height="40" rx="10" fill="#131c31" stroke="#14b8a6" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="140" y="200" text-anchor="middle" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">src_token_embed()</text>

  <!-- Arrow -->
  <line x1="140" y1="215" x2="140" y2="240" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow-teal)" opacity="0.9"/>

  <!-- Positional Encoding -->
  <rect x="65" y="247" width="150" height="40" rx="10" fill="#131c31" stroke="#14b8a6" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="140" y="272" text-anchor="middle" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">+ positional_encoding()</text>

  <!-- Shape annotation -->
  <text x="140" y="305" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">→ (batch, src_len, embed_dims)</text>

  <!-- Arrow -->
  <line x1="140" y1="288" x2="140" y2="318" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow-teal)" opacity="0.9"/>

  <!-- Source Mask -->
  <rect x="15" y="332" width="90" height="32" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="60" y="352" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">src_mask</text>

  <!-- ==================== ENCODER BOX ==================== -->
  <rect x="40" y="330" width="200" height="200" rx="16" fill="url(#encoderGrad)" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="330" width="200" height="200" rx="16" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>

  <text x="140" y="358" text-anchor="middle" fill="#ccfbf1" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Encoder</text>
  <text x="140" y="376" text-anchor="middle" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" opacity="0.8">EncoderBlock</text>

  <!-- Encoder Layers -->
  <rect x="65" y="390" width="150" height="30" rx="8" fill="#0b1a2e" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="140" y="410" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">EncoderLayer × N</text>

  <rect x="80" y="430" width="120" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <text x="140" y="446" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">MultiHeadAttention</text>

  <rect x="80" y="460" width="120" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <text x="140" y="476" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Add &amp; Norm</text>

  <rect x="80" y="490" width="120" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <text x="140" y="506" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">FeedForward</text>

  <!-- Encoder output labels -->
  <text x="140" y="548" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">→ enc_out</text>
  <text x="140" y="565" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">(batch, src_len, embed)</text>


  <!-- ==================== TARGET PATH (RIGHT) ==================== -->

  <!-- Target Input -->
  <rect x="675" y="95" width="170" height="48" rx="12" fill="#131c31" stroke="#fb7185" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="675" y="95" width="170" height="48" rx="12" fill="url(#tgtInputGrad)" opacity="0.15"/>
  <text x="760" y="120" text-anchor="middle" fill="#fb7185" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">tgt (token IDs)</text>
  <text x="760" y="140" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">(batch, tgt_seq_len)</text>

  <!-- Arrow -->
  <line x1="760" y1="143" x2="760" y2="168" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)" opacity="0.9"/>

  <!-- Target Token Embedding -->
  <rect x="685" y="175" width="150" height="40" rx="10" fill="#131c31" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="760" y="200" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">tgt_token_embed()</text>

  <!-- Arrow -->
  <line x1="760" y1="215" x2="760" y2="240" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)" opacity="0.9"/>

  <!-- Positional Encoding -->
  <rect x="685" y="247" width="150" height="40" rx="10" fill="#131c31" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="760" y="272" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">+ positional_encoding()</text>

  <!-- Shape annotation -->
  <text x="760" y="305" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">→ (batch, tgt_len, embed_dims)</text>

  <!-- Arrow -->
  <line x1="760" y1="288" x2="760" y2="318" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)" opacity="0.9"/>

  <!-- Target Mask -->
  <rect x="795" y="332" width="90" height="32" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="840" y="352" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">tgt_mask</text>

  <!-- ==================== DECODER BOX ==================== -->
  <rect x="660" y="330" width="200" height="250" rx="16" fill="url(#decoderGrad)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="330" width="200" height="250" rx="16" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.3"/>

  <text x="760" y="358" text-anchor="middle" fill="#f3e8ff" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Decoder</text>
  <text x="760" y="376" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" opacity="0.8">DecoderBlock</text>

  <!-- Decoder Layers -->
  <rect x="685" y="390" width="150" height="30" rx="8" fill="#0b1a2e" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="760" y="410" text-anchor="middle" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">DecoderLayer × N</text>

  <rect x="700" y="430" width="120" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <text x="760" y="446" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Masked Self-Attn</text>

  <rect x="700" y="460" width="120" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <text x="760" y="476" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Add &amp; Norm</text>

  <rect x="700" y="490" width="120" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <text x="760" y="506" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Cross-Attention</text>

  <rect x="700" y="520" width="120" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <text x="760" y="536" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Add &amp; Norm</text>

  <rect x="700" y="550" width="120" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <text x="760" y="566" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">FeedForward</text>

  <!-- Arrow out of decoder -->
  <line x1="760" y1="580" x2="760" y2="610" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)" opacity="0.9"/>

  <!-- ==================== CROSS-ATTENTION ARROW ==================== -->
  <!-- Glow line behind -->
  <line x1="240" y1="480" x2="700" y2="500" stroke="#fbbf24" stroke-width="4" stroke-dasharray="8,5" opacity="0.15" filter="url(#glow-amber)"/>
  <!-- Main line -->
  <line x1="240" y1="480" x2="700" y2="500" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrow-amber)" opacity="0.95"/>

  <!-- Label background for readability -->
  <rect x="405" y="430" width="130" height="22" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1" opacity="0.9"/>
  <text x="470" y="445" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">enc_out (K, V)</text>

  <!-- ==================== FINAL OUTPUT PATH ==================== -->

  <!-- Final Linear -->
  <rect x="685" y="618" width="150" height="42" rx="10" fill="#131c31" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="760" y="642" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">final_linear()</text>
  <text x="760" y="672" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">embed_dims → tgt_vocab_size</text>

  <!-- Arrow -->
  <line x1="760" y1="660" x2="760" y2="698" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)" opacity="0.9"/>

  <!-- Output -->
  <rect x="675" y="705" width="170" height="48" rx="12" fill="#131c31" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
  <rect x="675" y="705" width="170" height="48" rx="12" fill="url(#outputGrad)" opacity="0.2"/>
  <text x="760" y="730" text-anchor="middle" fill="#fb7185" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">logits</text>
  <text x="760" y="750" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">(batch, tgt_len, vocab_size)</text>


  <!-- ==================== LEGEND ==================== -->
  <rect x="300" y="600" width="300" height="150" rx="16" fill="#131c31" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="600" width="300" height="150" rx="16" fill="none" stroke="#475569" stroke-width="1" opacity="0.5"/>

  <text x="450" y="628" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Key Flow</text>
  <line x1="380" y1="636" x2="520" y2="636" stroke="#475569" stroke-width="1" opacity="0.5"/>

  <!-- Legend items -->
  <g transform="translate(0, 5)">
    <line x1="325" y1="655" x2="365" y2="655" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="345" cy="655" r="4" fill="#2dd4bf" opacity="0.3"/>
    <text x="375" y="660" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Source path (encoder)</text>
  </g>

  <g transform="translate(0, 5)">
    <line x1="325" y1="682" x2="365" y2="682" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
    <circle cx="345" cy="682" r="4" fill="#fb7185" opacity="0.3"/>
    <text x="375" y="687" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Target path (decoder)</text>
  </g>

  <g transform="translate(0, 5)">
    <line x1="325" y1="709" x2="365" y2="709" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
    <circle cx="345" cy="709" r="4" fill="#fbbf24" opacity="0.3"/>
    <text x="375" y="714" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Cross-attention (K, V)</text>
  </g>

  <!-- Subtle decorative dots in legend -->
  <circle cx="570" cy="655" r="2" fill="#2dd4bf" opacity="0.4"/>
  <circle cx="580" cy="655" r="2" fill="#2dd4bf" opacity="0.2"/>
  <circle cx="570" cy="682" r="2" fill="#fb7185" opacity="0.4"/>
  <circle cx="580" cy="682" r="2" fill="#fb7185" opacity="0.2"/>
  <circle cx="570" cy="709" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="580" cy="709" r="2" fill="#fbbf24" opacity="0.2"/>

</svg>
