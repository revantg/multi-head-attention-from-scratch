<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#2dd4bf"/>
    </marker>
    <marker id="m-rose" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#fb7185"/>
    </marker>
    <marker id="m-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="800" fill="#0b0f19"/>

  <!-- Header -->
  <text x="450" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="0.3">Transformer.forward()</text>
  <text x="450" y="72" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Data Flow Architecture</text>

  <!-- Divider -->
  <rect x="60" y="88" width="780" height="1" fill="#1e293b"/>

  <!-- ==================== LEFT COLUMN (Encoder Path) ==================== -->

  <g id="src-input">
    <rect x="60" y="105" width="170" height="48" rx="10" fill="#131c2e" stroke="#2dd4bf" stroke-width="2"/>
    <text x="145" y="130" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="14" font-weight="600">src (token IDs)</text>
    <text x="145" y="148" text-anchor="middle" fill="#475569" font-family="ui-monospace, monospace" font-size="10">(batch, src_seq_len)</text>
  </g>

  <line x1="145" y1="153" x2="145" y2="178" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#m-teal)"/>

  <g id="src-embed">
    <rect x="70" y="185" width="150" height="42" rx="8" fill="#131c2e" stroke="#115e59" stroke-width="1.5"/>
    <text x="145" y="212" text-anchor="middle" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="500">src_token_embed()</text>
  </g>

  <line x1="145" y1="227" x2="145" y2="252" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#m-teal)"/>

  <g id="src-pos">
    <rect x="70" y="260" width="150" height="42" rx="8" fill="#131c2e" stroke="#115e59" stroke-width="1.5"/>
    <text x="145" y="287" text-anchor="middle" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="500">+ positional_encoding()</text>
  </g>

  <text x="145" y="320" text-anchor="middle" fill="#475569" font-family="ui-monospace, monospace" font-size="10">(batch, src_len, embed_dims)</text>
  <line x1="145" y1="302" x2="145" y2="332" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#m-teal)"/>

  <g id="src-mask">
    <rect x="20" y="345" width="90" height="30" rx="6" fill="#131c2e" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="65" y="365" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="500">src_mask</text>
  </g>

  <!-- Encoder Block -->
  <g id="encoder-block">
    <rect x="45" y="345" width="200" height="220" rx="14" fill="#0f1623" stroke="#0d9488" stroke-width="2"/>
    <text x="145" y="378" text-anchor="middle" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Encoder</text>
    <text x="145" y="398" text-anchor="middle" fill="#5eead4" font-family="system-ui, sans-serif" font-size="11" opacity="0.8">EncoderBlock</text>

    <rect x="70" y="415" width="150" height="32" rx="6" fill="#131c2e" stroke="#0d9488" stroke-width="1.5"/>
    <text x="145" y="436" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="12" font-weight="600">EncoderLayer × N</text>

    <rect x="85" y="458" width="120" height="24" rx="4" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <text x="145" y="474" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">MultiHeadAttention</text>

    <rect x="85" y="490" width="120" height="24" rx="4" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <text x="145" y="506" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Add &amp; Norm</text>

    <rect x="85" y="522" width="120" height="24" rx="4" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <text x="145" y="538" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">FeedForward</text>
  </g>

  <text x="145" y="588" text-anchor="middle" fill="#475569" font-family="ui-monospace, monospace" font-size="10">enc_out</text>
  <text x="145" y="605" text-anchor="middle" fill="#334155" font-family="ui-monospace, monospace" font-size="9">(batch, src_len, embed)</text>

  <!-- ==================== RIGHT COLUMN (Decoder Path) ==================== -->

  <g id="tgt-input">
    <rect x="670" y="105" width="170" height="48" rx="10" fill="#131c2e" stroke="#fb7185" stroke-width="2"/>
    <text x="755" y="130" text-anchor="middle" fill="#fb7185" font-family="system-ui, sans-serif" font-size="14" font-weight="600">tgt (token IDs)</text>
    <text x="755" y="148" text-anchor="middle" fill="#475569" font-family="ui-monospace, monospace" font-size="10">(batch, tgt_seq_len)</text>
  </g>

  <line x1="755" y1="153" x2="755" y2="178" stroke="#fb7185" stroke-width="2.5" marker-end="url(#m-rose)"/>

  <g id="tgt-embed">
    <rect x="680" y="185" width="150" height="42" rx="8" fill="#131c2e" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="755" y="212" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="500">tgt_token_embed()</text>
  </g>

  <line x1="755" y1="227" x2="755" y2="252" stroke="#fb7185" stroke-width="2.5" marker-end="url(#m-rose)"/>

  <g id="tgt-pos">
    <rect x="680" y="260" width="150" height="42" rx="8" fill="#131c2e" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="755" y="287" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="500">+ positional_encoding()</text>
  </g>

  <text x="755" y="320" text-anchor="middle" fill="#475569" font-family="ui-monospace, monospace" font-size="10">(batch, tgt_len, embed_dims)</text>
  <line x1="755" y1="302" x2="755" y2="332" stroke="#fb7185" stroke-width="2.5" marker-end="url(#m-rose)"/>

  <g id="tgt-mask">
    <rect x="790" y="345" width="90" height="30" rx="6" fill="#131c2e" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="835" y="365" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="500">tgt_mask</text>
  </g>

  <!-- Decoder Block -->
  <g id="decoder-block">
    <rect x="655" y="345" width="200" height="270" rx="14" fill="#0f1623" stroke="#7c3aed" stroke-width="2"/>
    <text x="755" y="378" text-anchor="middle" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Decoder</text>
    <text x="755" y="398" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="11" opacity="0.8">DecoderBlock</text>

    <rect x="680" y="415" width="150" height="32" rx="6" fill="#131c2e" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="755" y="436" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DecoderLayer × N</text>

    <rect x="695" y="458" width="120" height="24" rx="4" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <text x="755" y="474" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Masked Self-Attn</text>

    <rect x="695" y="490" width="120" height="24" rx="4" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <text x="755" y="506" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Add &amp; Norm</text>

    <rect x="695" y="522" width="120" height="24" rx="4" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <text x="755" y="538" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Cross-Attention</text>

    <rect x="695" y="554" width="120" height="24" rx="4" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <text x="755" y="570" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Add &amp; Norm</text>

    <rect x="695" y="586" width="120" height="24" rx="4" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <text x="755" y="602" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">FeedForward</text>
  </g>

  <line x1="755" y1="615" x2="755" y2="650" stroke="#fb7185" stroke-width="2.5" marker-end="url(#m-rose)"/>

  <!-- Final Linear -->
  <g id="final-linear">
    <rect x="680" y="658" width="150" height="42" rx="8" fill="#131c2e" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="755" y="683" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="500">final_linear()</text>
    <text x="755" y="710" text-anchor="middle" fill="#475569" font-family="ui-monospace, monospace" font-size="10">embed_dims → tgt_vocab_size</text>
  </g>

  <line x1="755" y1="700" x2="755" y2="740" stroke="#fb7185" stroke-width="2.5" marker-end="url(#m-rose)"/>

  <!-- Output -->
  <g id="output">
    <rect x="670" y="748" width="170" height="48" rx="10" fill="#131c2e" stroke="#fb7185" stroke-width="2"/>
    <text x="755" y="773" text-anchor="middle" fill="#fb7185" font-family="system-ui, sans-serif" font-size="15" font-weight="700">logits</text>
    <text x="755" y="793" text-anchor="middle" fill="#475569" font-family="ui-monospace, monospace" font-size="10">(batch, tgt_len, vocab_size)</text>
  </g>

  <!-- ==================== CROSS-ATTENTION ==================== -->
  <line x1="245" y1="520" x2="695" y2="532" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#m-amber)"/>
  <rect x="420" y="470" width="110" height="22" rx="5" fill="#131c2e" stroke="#fbbf24" stroke-width="1"/>
  <text x="475" y="485" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">enc_out (K, V)</text>

  <!-- ==================== LEGEND ==================== -->
  <g id="legend" transform="translate(0, 30)">
    <rect x="300" y="640" width="300" height="130" rx="12" fill="#0f1623" stroke="#1e293b" stroke-width="1.5"/>
    <text x="450" y="670" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Key Flow</text>

    <line x1="325" y1="695" x2="360" y2="695" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <text x="375" y="700" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Source path (encoder)</text>

    <line x1="325" y1="720" x2="360" y2="720" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
    <text x="375" y="725" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Target path (decoder)</text>

    <line x1="325" y1="745" x2="360" y2="745" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
    <text x="375" y="750" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Cross-attention (K, V)</text>
  </g>
</svg>
